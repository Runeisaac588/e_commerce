name: e_commerce
description: "A new Flutter project."
 
 
publish_to: 'none'  


 
version: 1.0.0+1

environment:
  sdk: ^3.13.4
 
 
dependencies:
  flutter:
    sdk: flutter


  http: ^1.6.0
  intl: ^0.20.3
  logger: ^2.8.0
  url_launcher: ^6.1.12

  iconsax_flutter: ^1.0.0
  cupertino_icons: ^1.0.8

  get: ^4.7.3
  get_storage: ^2.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
   
  flutter_lints: ^6.0.0

 
flutter:
   
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

fonts:
  - family: Poppins
    fonts:
      - asset: assets/fonts/Poppins-Light.ttf
        weight: 300
      - asset: assets/fonts/Poppins-Regular.ttf
        weight: 400
      - asset: assets/fonts/Poppins-Italic.ttf
        style: italic
      - asset: assets/fonts/Poppins-Medium.ttf
        weight: 500
      - asset: assets/fonts/Poppins-MediumItalic.ttf
        weight: 500
        style: italic
      - asset: assets/fonts/Poppins-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Poppins-Bold.ttf
        weight: 800
